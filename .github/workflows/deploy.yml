name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04  # 锁定 Ubuntu 版本

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5  # 升级到 v5

      - name: Setup Python
        uses: actions/setup-python@v6  # 升级到 v6
        with:
          python-version: "3.11"

      - name: Install boto3
        run: pip install boto3

      - name: Build site
        run: |
          # 你的构建命令，例如 npm run build
          mkdir -p dist

      - name: Inject Presigned URLs
        env:
          BITIFUL_ACCESS_KEY: ${{ secrets.BITIFUL_ACCESS_KEY }}
          BITIFUL_SECRET_KEY: ${{ secrets.BITIFUL_SECRET_KEY }}
        run: python scripts/inject_presigned_urls.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4