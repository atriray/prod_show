<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品集 · Personal Archive</title>
    <script>
      // 在应用挂载前应用已保存的主题，默认亮色

    </script>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
